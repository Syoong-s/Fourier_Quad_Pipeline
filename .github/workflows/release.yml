name: Publish release

# Trigger: version tags (v*) or manual dispatch. Each scientific/deployment
# directory remains a separate zip. English docs are packaged independently.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release with zipped directories
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package each content directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # Keep each source and launcher folder as its own archive.
          # Documentation is bundled separately below to keep both manuals
          # together with the root navigation and license.
          find . -maxdepth 1 -mindepth 1 -type d \
              ! -name '.git' \
              ! -name '.planning' \
              ! -name '.github' \
              ! -name 'artifacts' \
              ! -name 'doc' \
              -print0 | sort -z | while IFS= read -r -d '' dir; do
            dirname="$(basename "$dir")"
            echo "Zipping: $dirname"
            zip -q -r "artifacts/${dirname}.zip" "$dir" \
                -x '*/.git/*' '*/.git'
          done

          # The English documentation has two independent systems under doc/.
          zip -q -r artifacts/docs.zip README.md LICENSE doc/ \
              init_program/README.md

          echo "=== Artifact list ==="
          ls -lh artifacts/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.zip
